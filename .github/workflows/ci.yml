name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate recipe data
        run: npm run validate

      - name: Check that css/tailwind.css is up to date
        run: |
          npm run build:css
          git diff --exit-code -- css/tailwind.css || {
            echo "::error::css/tailwind.css is stale. Run 'npm run build:css' and commit the result."
            exit 1
          }

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm test
